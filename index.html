<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Haneen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f1ea; --text: #3d3d5c; }
        .dark-mode { --bg: #1a1a1a; --text: #f4f1ea; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            transition: background-color 0.5s, color 0.5s; 
            overflow-x: hidden; 
        }
        .serif { font-family: 'Playfair Display', serif; }
        .doodle-border { border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; }

        /* Page Entrance Animation */
        .fade-in-up { 
            opacity: 0; 
            transform: translateY(30px); 
            animation: fadeInUp 0.8s forwards ease-out; 
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen relative">

    <nav class="flex justify-between items-center p-8 max-w-6xl mx-auto relative z-50">
        <div class="text-2xl font-bold serif">H.</div>
        
        <div class="space-x-8 hidden md:flex">
            <a href="#" class="hover:underline">Home</a>
            <a href="About.html" class="hover:underline">About</a>
            <a href="Projects.html" class="hover:underline">Projects</a>
            <a href="contact.html" class="hover:underline">Contact</a>
        </div>

        <div class="flex items-center space-x-4">
            <button id="darkModeBtn" class="p-2 border border-current rounded-full transition-all duration-300">
                ☾ ⋆
            </button>
            <button id="menuToggle" class="md:hidden p-2 text-2xl">☰</button>
        </div>
    </nav>

    <div id="mobileMenu" class="fixed inset-0 z-[100] flex flex-col items-center justify-center space-y-8 text-2xl serif transform translate-x-full transition-transform duration-500 ease-in-out md:hidden" style="background-color: var(--bg);">
        <button id="closeMenu" class="absolute top-8 right-8 text-4xl p-4">✕</button>
        <a href="#" class="menu-link hover:opacity-70 transition">Home</a>
        <a href="About.html" class="menu-link hover:opacity-70 transition">About</a>
        <a href="Projects.html" class="menu-link hover:opacity-70 transition">Projects</a>
        <a href="contact.html" class="menu-link hover:opacity-70 transition">Contact</a>
    </div>

    <main class="max-w-6xl mx-auto px-8 py-20 flex flex-col items-center text-center fade-in-up">
        
        <h1 class="text-7xl md:text-[10rem] serif opacity-90 mb-10 leading-none">
            Portfolio
        </h1>

        <div class="grid md:grid-cols-2 gap-12 items-center mt-10 text-left">
            <div class="relative mx-auto order-last md:order-first">
                <div class="w-64 h-64 rounded-full border-4 border-current overflow-hidden doodle-border group">
                    <img src="Hiromi Higuruma (1).png" alt="Haneen" class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-110 transition duration-700">
                </div>
                <span class="absolute -top-4 -right-4 text-4xl animate-pulse">ᶻ 𝗓 𐰁</span>
            </div>

            <div class="space-y-6">
                <p class="text-xl serif italic">Hi! My name is Haneen</p>
                <h2 class="text-3xl font-bold">Frontend Developer</h2>
                <p class="text-lg leading-relaxed opacity-80">
                    I focus on building clean, elegant, and responsive web interfaces. Currently developing technical solutions that bridge the gap between science and digital art.
                </p>
                <a href="Projects.html" class="inline-block px-10 py-4 bg-[#3d3d5c] dark:bg-[#f4f1ea] dark:text-[#3d3d5c] text-white rounded-full hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
                    View My Work
                </a>
            </div>
        </div>
    </main>

    <script>
        const body = document.body;
        const btn = document.getElementById('darkModeBtn');
        const menuToggle = document.getElementById('menuToggle');
        const closeMenu = document.getElementById('closeMenu');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuLinks = document.querySelectorAll('.menu-link');

        // Dark Mode Logic
        function updateDarkMode() {
            const isDark = body.classList.contains('dark-mode');
            btn.innerHTML = isDark ? '☀︎' : '☾ ⋆';
            localStorage.setItem('portfolio-theme', isDark ? 'dark' : 'light');
        }

        btn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            updateDarkMode();
        });

        if (localStorage.getItem('portfolio-theme') === 'dark') {
            body.classList.add('dark-mode');
            updateDarkMode();
        }

        // Mobile Menu Logic (Tailwind Class Toggling)
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.remove('translate-x-full');
            mobileMenu.classList.add('translate-x-0');
            body.style.overflow = 'hidden'; // Stops background scrolling
        });

        const hideMenu = () => {
            mobileMenu.classList.add('translate-x-full');
            mobileMenu.classList.remove('translate-x-0');
            body.style.overflow = ''; // Restores scrolling
        };

        closeMenu.addEventListener('click', hideMenu);
        menuLinks.forEach(link => link.addEventListener('click', hideMenu));

    </script>
</body>
</html>
